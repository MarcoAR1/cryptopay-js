<!doctype html>
<html lang="es"><meta charset="utf-8"><title>CryptoPay: piloto privado</title>
<body><h1>Checkout de prueba</h1><p>Usar una sesi?n creada por el backend en Sepolia.</p>
<label>API URL <input id="url" value="http://localhost:3001"></label>
<label>Payment ID <input id="payment"></label>
<label>Checkout token <input id="token" autocomplete="off"></label>
<button id="open" type="button">Mostrar checkout</button><div id="checkout"></div>
<script src="./dist/checkout.js"></script>
<script>
let checkout;
document.querySelector('#open').onclick = () => {
  checkout?.unmount();
  checkout = CryptoPay.createCheckout({ baseUrl: document.querySelector('#url').value,
    paymentId: document.querySelector('#payment').value, checkoutToken: document.querySelector('#token').value,
    onSuccess: () => console.log('Confirmado en gateway; consultar estado de la reserva en backend.'), onError: console.error });
  checkout.mount('#checkout');
};
</script></body></html>
