name: Publish @cryptopayjs/sdk to npm

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Build, test, and publish @cryptopayjs/sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure latest npm (OIDC trusted publishing requires npm >= 11.5)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run verification test suite
        run: npm test

      - name: Build distribution bundles
        run: npm run build

      - name: Audit package provenance & integrity
        run: npm run verify

      - name: Publish to npm registry
        shell: bash
        timeout-minutes: 10
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PUBLISHED=$(npm show @cryptopayjs/sdk version 2>/dev/null || echo "0.0.0")
          LOCAL=$(node -p "require('./package.json').version")

          echo "Current npm registry version: $PUBLISHED"
          echo "Local repository version:     $LOCAL"

          if [ "$LOCAL" != "$PUBLISHED" ]; then
            echo "Publishing @cryptopayjs/sdk@$LOCAL to npm..."
            npm publish --access public --provenance
            echo "Successfully published @cryptopayjs/sdk@$LOCAL to npm!"
          else
            echo "Version $LOCAL is already published to npm — release skipped."
          fi
